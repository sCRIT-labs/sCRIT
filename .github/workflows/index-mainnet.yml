# Index Robinhood mainnet events every 10 minutes.
# Same idempotent script as local ops (`pnpm index:events --mainnet`):
# restartable, cursor-based, `on conflict do nothing`.
# Needs exactly one repo secret: DATABASE_URL (no private keys ever).
name: index-mainnet

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  SCRIT_MAINNET_INDEXER_START_BLOCK: "74475976"
  SCRIT_MAINNET_INDEXER_CONFIRMATIONS: "5"
  SCRIT_MAINNET_INDEXER_BATCH_BLOCKS: "1000"
  ROBINHOOD_MAINNET_RPC_URL: https://rpc.mainnet.chain.robinhood.com
  NEXT_PUBLIC_SCRIT_LAUNCHER_MAINNET: "0x2e0de4486b391c182a6727d5480380f9820c73d5"
  NEXT_PUBLIC_SCRIT_RESERVE_MANAGER_MAINNET: "0x0cc054ce72fc0a489732e20dd595de934be2e953"
  NEXT_PUBLIC_SCRIT_CUSTODIANS_MAINNET: "0x4993478847d03e13d5eae930878ad428cf2b27f8"
  NEXT_PUBLIC_SCRIT_PRICE_ADAPTER_MAINNET: "0x5341042250dcbc11a929581d22b7be30c14640df"
  NEXT_PUBLIC_SCRIT_LOT_MANAGER_MAINNET: "0x4f0332621e9a1f2d79dc3095b0cf82297a562a33"
  NEXT_PUBLIC_SCRIT_LOT_TOKEN_MAINNET: "0x46b01dcdad1fb6dbd95bbd2e88f4f69064bd1bf1"
  NEXT_PUBLIC_SCRIT_LOT_MARKETPLACE_MAINNET: "0xf8e56794c0ded1e01b8f973ff0f6d2f86f8e43e7"
  NEXT_PUBLIC_SCRIT_REDEMPTION_MAINNET: "0x6809f71adc27a158a6ab4d74bd6a7ac228014827"
  NEXT_PUBLIC_SCRIT_TAX_HOOK_MAINNET: "0x5a0e9b72a3fcad25cf30757164c90d51f4ca2044"
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm index:events --mainnet
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
